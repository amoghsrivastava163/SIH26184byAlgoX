<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Background -->
  <rect width="200" height="80" fill="none"/>
  
  <!-- Tricolor vertical bar on left -->
  <rect x="0" y="0" width="10" height="26.6" fill="#FF9933"/>
  <rect x="0" y="26.6" width="10" height="26.8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.2"/>
  <rect x="0" y="53.4" width="10" height="26.6" fill="#138808"/>
  
  <!-- Ashoka Chakra small on bar -->
  <circle cx="5" cy="40" r="3.5" fill="none" stroke="#000080" stroke-width="0.7"/>
  <circle cx="5" cy="40" r="0.6" fill="#000080"/>
  
  <!-- Main text block -->
  <!-- "75" large number -->
  <text x="22" y="52" font-family="Georgia, serif" font-size="38" font-weight="900" fill="#FF6B00" letter-spacing="-2">75</text>
  
  <!-- Superscript th -->
  <text x="72" y="30" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#FF6B00">वाँ</text>
  
  <!-- "YEARS" text -->
  <text x="20" y="66" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#1A237E" letter-spacing="2.5">YEARS</text>
  
  <!-- Divider line -->
  <line x1="90" y1="8" x2="90" y2="72" stroke="#CC9900" stroke-width="1"/>
  
  <!-- Right side text -->
  <text x="98" y="25" font-family="Devanagari, Arial, sans-serif" font-size="8" font-weight="700" fill="#FF6B00" letter-spacing="0.5">आज़ादी का</text>
  <text x="98" y="39" font-family="Georgia, serif" font-size="10.5" font-weight="900" fill="#1A237E" letter-spacing="0.5">AZADI KA</text>
  <text x="98" y="52" font-family="Georgia, serif" font-size="10.5" font-weight="900" fill="#1A237E" letter-spacing="0.5">AMRIT</text>
  <text x="98" y="65" font-family="Georgia, serif" font-size="10.5" font-weight="900" fill="#138808" letter-spacing="0.5">MAHOTSAV</text>
  
  <!-- Bottom decorative line -->
  <rect x="98" y="69" width="96" height="1.5" fill="#FF9933"/>
</svg>
